<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bg-zaib_husain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151122"/>
      <stop offset="100%" stop-color="#0C0915"/>
    </linearGradient>
    <radialGradient id="glow-zaib_husain" cx="50%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="badge-grad-zaib_husain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="border-grad-zaib_husain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.4"/>
    </linearGradient>
    <pattern id="grid-zaib_husain" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1000" fill="url(#bg-zaib_husain)"/>
  <!-- Subtle Grid Texture -->
  <rect width="800" height="1000" fill="url(#grid-zaib_husain)"/>
  <!-- Ambient Radial Glow -->
  <circle cx="400" cy="380" r="420" fill="url(#glow-zaib_husain)"/>

  <!-- Stylized Decorative Frame -->
  <rect x="30" y="30" width="740" height="940" rx="20" fill="none" stroke="url(#border-grad-zaib_husain)" stroke-width="1.5" stroke-dasharray="8 4" stroke-opacity="0.5"/>
  <circle cx="30" cy="30" r="4" fill="#8B5CF6"/>
  <circle cx="770" cy="30" r="4" fill="#8B5CF6"/>
  <circle cx="30" cy="970" r="4" fill="#A78BFA"/>
  <circle cx="770" cy="970" r="4" fill="#A78BFA"/>

  <!-- Central Silhouette & Monogram Emblem -->
  <g transform="translate(400, 380)">
    <!-- Outer concentric rings -->
    <circle r="190" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
    <circle r="160" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="12 6"/>
    <circle r="130" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle r="110" fill="url(#bg-zaib_husain)" stroke="url(#border-grad-zaib_husain)" stroke-width="2"/>

    <!-- Stylized Human Portrait Silhouette Contour -->
    <path d="M -70 120 C -70 85 -55 70 -30 65 C -20 63 -15 50 -20 38 C -26 22 -24 -15 0 -22 C 24 -15 26 22 20 38 C 15 50 20 63 30 65 C 55 70 70 85 70 120 Z" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="0" cy="8" r="32" fill="#8B5CF6" fill-opacity="0.2"/>

    <!-- Monogram Typography Badge -->
    <text x="0" y="16" font-family="'Roc Grotesk', 'Inter', -apple-system, sans-serif" font-size="44" font-weight="700" fill="url(#badge-grad-zaib_husain)" text-anchor="middle" letter-spacing="0.05em">ZH</text>
  </g>

  <!-- Technical Monogram Watermark Accent -->
  <text x="400" y="620" font-family="'Azeret Mono', monospace" font-size="12" font-weight="600" fill="#8B5CF6" fill-opacity="0.8" text-anchor="middle" letter-spacing="0.25em" text-transform="uppercase">BGS :: EXECUTIVE NETWORK</text>

  <!-- Lower Details Card Badge -->
  <g transform="translate(400, 720)">
    <rect x="-310" y="0" width="620" height="180" rx="14" fill="#111111" fill-opacity="0.8" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <line x1="-310" y1="0" x2="-210" y2="0" stroke="#8B5CF6" stroke-width="3"/>
    
    <!-- Verified Badge Indicator -->
    <circle cx="-270" cy="50" r="14" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-width="1"/>
    <circle cx="-270" cy="50" r="5" fill="#8B5CF6"/>
    <text x="-244" y="55" font-family="'Azeret Mono', monospace" font-size="11" font-weight="500" fill="rgba(255,255,255,0.6)" letter-spacing="0.1em" text-transform="uppercase">PROFILE ACTIVE</text>

    <!-- Name Heading -->
    <text x="-270" y="100" font-family="'Roc Grotesk', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" letter-spacing="-0.01em">Zaib Husain</text>

    <!-- Role Subheading -->
    <text x="-270" y="136" font-family="'Azeret Mono', monospace" font-size="14" font-weight="500" fill="#8B5CF6" letter-spacing="0.04em">Advisor</text>
  </g>

  <!-- Stylized Corner Tech Accent Lines -->
  <path d="M 50 60 L 50 50 L 60 50" fill="none" stroke="#8B5CF6" stroke-width="2"/>
  <path d="M 750 60 L 750 50 L 740 50" fill="none" stroke="#8B5CF6" stroke-width="2"/>
  <path d="M 50 940 L 50 950 L 60 950" fill="none" stroke="#A78BFA" stroke-width="2"/>
  <path d="M 750 940 L 750 950 L 740 950" fill="none" stroke="#A78BFA" stroke-width="2"/>
</svg>
